# basic-cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: iata-cluster
  region: us-east-1
  version: "1.34"

nodeGroups:
  - name: worker-nodes
    instanceType: c7i-flex.large
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    privateNetworking: true
    ssh:
      allow: false
